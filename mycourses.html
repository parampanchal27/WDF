<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses - StudentHub</title>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="header">
        <h1>StudentHub Portal</h1>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch theme">🌙 Dark Mode</button>
        <nav class="indexnav" aria-label="Primary navigation">
            <a href="index.html">Home</a> <a href="coursedetails.html">Courses</a> <a href="mycourses.html">My Courses</a> <a href="assignments.html">Assignments</a> <a href="grades.html">Grades</a> <a href="schedule.html">Schedule</a> <a href="announcement.html">Announcements</a> <a href="calendar.html">Calendar</a> <a href="profile.html">Profile</a> <a href="login.html">Login</a> <a href="coursedetails.html">Course Details</a>
        </nav>
    </header>
    <hr>

    <main id="main-content" tabindex="-1">
        <h2>My Enrolled Courses</h2>
        <p>You are currently enrolled in <strong id="courseCount">0 courses</strong>. Here are your course details:</p>

        <section class="data-controls" aria-label="Course controls">
            <div class="data-search-wrap">
                <label class="data-label" for="courseSearch">Search courses</label>
                <input id="courseSearch" type="search" placeholder="Search courses..." aria-label="Search courses">
            </div>
            <div class="data-filter-wrap">
                <label class="data-label" for="courseFilter">Filter by code</label>
                <select id="courseFilter" aria-label="Filter courses by code">
                    <option value="all">All</option>
                </select>
            </div>
        </section>

        <div id="courseStatus" class="data-status" aria-live="polite"></div>
        <section id="courseList" class="data-list" aria-live="polite" aria-label="Enrolled courses"></section>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 StudentHub Portal. All rights reserved.</p>
    </footer>
    <script src="script.js?v=4"></script>
</body>
</html>
