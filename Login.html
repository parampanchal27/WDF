</head>
<body>
    <header class="header">
        <h1 align="center">StudentHub Portal</h1>
        <nav class="indexnav">
            <a href="index.html">Home</a> | 
            <a href="coursedetails.html">Courses</a> | 
            <a href="mycourses.html">My Courses</a> |

        </nav>
    </header>
    <hr>

    <main>
        <div class="login-container">
            <div class="login-card">
                <h2>Welcome Back!</h2>
                <p>Login to your StudentHub account</p>

                <form action="#" method="POST" novalidate>
                    <div class="login-form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <div class="login-form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>

                    <div class="login-form-remember">
                        <label>
                            <input type="checkbox" name="remember">Remember me
                            
                        </label>
                        <a href="#" class="login-forgot-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="login-btn">Login</button>
                </form>

                <hr class="login-divider">

                <p class="login-register-text">
                    Don't have an account? <a href="register.html" class="login-register-link">Register here</a>
                </p>
            </div>
    <hr>
    </main>

</body>
