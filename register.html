<!doctype html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <main>
        <h1 class="register">Register</h1>
        <form id="registerForm" action="#" method="POST" novalidate>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username">
            <small id="usernameError" class="error-message"></small><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <small id="emailError" class="error-message"></small><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
            <small id="passwordError" class="error-message"></small><br><br>

            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" name="confirmPassword">
            <small id="confirmPasswordError" class="error-message"></small><br><br>

            <input type="submit" value="Register">
        </form>
        <p id="successMessage" class="success-message"></p>
        <p>Already have an account? <a href="login.html">Login here</a>.</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
